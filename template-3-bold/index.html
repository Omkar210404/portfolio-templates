<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Portfolio of Your Name, AI/ML engineer.">
<title>Your Name | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- EDIT GUIDE: your content lives in the DATA object at the top of script.js.
     For the contact form, replace YOUR_ACCESS_KEY below (free key at web3forms.com). -->
<div id="bar" aria-hidden="true"></div>
<div id="ring" aria-hidden="true"></div>

<nav id="nav" aria-label="Main">
  <a class="logo" href="#top" id="logo">YN</a>
  <div class="sw" id="sw" role="group" aria-label="Colour theme"></div>
  <div class="links"><a href="#about">About</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#projects">Projects</a><a href="#contact">Contact</a></div>
</nav>

<header id="top">
  <h1 id="name">Your Name</h1>
  <p class="tag" id="tag"></p>
  <div class="cta"><a class="btn" href="#projects">See my work</a><a class="btn ghost" href="#contact">Say hello</a></div>
</header>

<div class="marquee" aria-hidden="true"><div id="track"></div></div>

<main>
  <section id="about"><h2>About</h2><div class="about"><p id="aboutText"></p><dl class="now" id="now"></dl></div></section>
  <section id="skills"><h2>Skills</h2><div class="skills" id="skillGrid"></div></section>
  <section id="experience"><h2>Experience</h2><ol class="xp" id="xp"></ol></section>
  <section id="projects"><h2>Projects</h2><ul class="list" id="list"></ul></section>
</main>

<footer id="contact">
  <div class="ct">
    <div>
      <h2>Let's work together</h2>
      <div class="mail"><a id="mail" href="#"></a><button type="button" id="copy">Copy email</button></div>
      <p id="copied" role="status"></p>
    </div>
    <form id="form" action="https://api.web3forms.com/submit" method="POST" novalidate>
      <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY">
      <input type="hidden" name="from_name" value="Portfolio contact form">
      <input type="checkbox" name="botcheck" class="bot" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label>Name<input name="name" required autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Message<textarea name="message" rows="4" required></textarea></label>
      <button class="send" type="submit">Send message</button>
      <p id="status" role="status"></p>
    </form>
  </div>
  <div class="foot"><span id="links"></span><a href="#top">Back to top</a></div>
</footer>

<div id="peek" aria-hidden="true"></div>
<noscript><p style="padding:2rem">This portfolio needs JavaScript. Contact: you@email.com</p></noscript>
<script src="script.js"></script>
</body>
</html>
